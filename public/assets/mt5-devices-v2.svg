<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="MetaTrader 5 on laptop, phone and tablet">
  <defs>
    <!-- Shared screen + body gradients -->
    <linearGradient id="mt5-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e12"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="mt5-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d141a"/>
      <stop offset="1" stop-color="#06090c"/>
    </linearGradient>
    <linearGradient id="mt5-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe1e8"/>
      <stop offset="1" stop-color="#a3acb8"/>
    </linearGradient>
    <linearGradient id="mt5-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="mt5-floor" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#1ad17a" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#1ad17a" stop-opacity=".05"/>
      <stop offset="1" stop-color="#1ad17a" stop-opacity="0"/>
    </radialGradient>
    <filter id="mt5-blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="device-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Re-usable MT5 chart pattern: candlesticks -->
    <symbol id="mt5-chart" viewBox="0 0 320 200">
      <rect width="320" height="200" fill="#0a0e12"/>
      <!-- Grid -->
      <g stroke="#1f2a30" stroke-width=".5" opacity=".7">
        <line x1="0" y1="40" x2="320" y2="40"/>
        <line x1="0" y1="80" x2="320" y2="80"/>
        <line x1="0" y1="120" x2="320" y2="120"/>
        <line x1="0" y1="160" x2="320" y2="160"/>
        <line x1="40" y1="0" x2="40" y2="200"/>
        <line x1="80" y1="0" x2="80" y2="200"/>
        <line x1="120" y1="0" x2="120" y2="200"/>
        <line x1="160" y1="0" x2="160" y2="200"/>
        <line x1="200" y1="0" x2="200" y2="200"/>
        <line x1="240" y1="0" x2="240" y2="200"/>
        <line x1="280" y1="0" x2="280" y2="200"/>
      </g>
      <!-- Candles: alternating green / red bars -->
      <g>
        <!-- bullish (green) -->
        <line x1="14" y1="100" x2="14" y2="140" stroke="#1ad17a" stroke-width=".8"/><rect x="10" y="108" width="8" height="22" fill="#1ad17a"/>
        <line x1="34" y1="90"  x2="34" y2="135" stroke="#1ad17a" stroke-width=".8"/><rect x="30" y="96"  width="8" height="30" fill="#1ad17a"/>
        <line x1="54" y1="70"  x2="54" y2="120" stroke="#1ad17a" stroke-width=".8"/><rect x="50" y="80"  width="8" height="30" fill="#1ad17a"/>
        <!-- bearish (red) -->
        <line x1="74" y1="80"  x2="74" y2="115" stroke="#ef4444" stroke-width=".8"/><rect x="70" y="86"  width="8" height="20" fill="#ef4444"/>
        <line x1="94" y1="95"  x2="94" y2="130" stroke="#ef4444" stroke-width=".8"/><rect x="90" y="100" width="8" height="22" fill="#ef4444"/>
        <line x1="114" y1="60" x2="114" y2="115" stroke="#1ad17a" stroke-width=".8"/><rect x="110" y="70" width="8" height="36" fill="#1ad17a"/>
        <line x1="134" y1="50" x2="134" y2="95"  stroke="#1ad17a" stroke-width=".8"/><rect x="130" y="58" width="8" height="28" fill="#1ad17a"/>
        <line x1="154" y1="65" x2="154" y2="110" stroke="#ef4444" stroke-width=".8"/><rect x="150" y="74" width="8" height="28" fill="#ef4444"/>
        <line x1="174" y1="40" x2="174" y2="90"  stroke="#1ad17a" stroke-width=".8"/><rect x="170" y="48" width="8" height="34" fill="#1ad17a"/>
        <line x1="194" y1="30" x2="194" y2="70"  stroke="#1ad17a" stroke-width=".8"/><rect x="190" y="36" width="8" height="26" fill="#1ad17a"/>
        <line x1="214" y1="45" x2="214" y2="80"  stroke="#ef4444" stroke-width=".8"/><rect x="210" y="50" width="8" height="22" fill="#ef4444"/>
        <line x1="234" y1="20" x2="234" y2="60"  stroke="#1ad17a" stroke-width=".8"/><rect x="230" y="26" width="8" height="28" fill="#1ad17a"/>
        <line x1="254" y1="10" x2="254" y2="50"  stroke="#1ad17a" stroke-width=".8"/><rect x="250" y="14" width="8" height="32" fill="#1ad17a"/>
        <line x1="274" y1="22" x2="274" y2="58"  stroke="#ef4444" stroke-width=".8"/><rect x="270" y="28" width="8" height="22" fill="#ef4444"/>
        <line x1="294" y1="8"  x2="294" y2="44"  stroke="#1ad17a" stroke-width=".8"/><rect x="290" y="12" width="8" height="26" fill="#1ad17a"/>
      </g>
      <!-- Right-side y-axis label -->
      <g font-family="'JetBrains Mono', monospace" font-size="6" fill="#7f8a93">
        <text x="304" y="40">1.0850</text>
        <text x="304" y="80">1.0825</text>
        <text x="304" y="120">1.0800</text>
        <text x="304" y="160">1.0775</text>
      </g>
      <!-- Last price tag (green) -->
      <rect x="288" y="14" width="30" height="10" fill="#1ad17a"/>
      <text x="303" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" fill="#001b0e">1.0871</text>
    </symbol>
  </defs>

  <!-- Floor glow -->
  <ellipse cx="600" cy="700" rx="520" ry="60" fill="url(#mt5-floor)" filter="url(#mt5-blur)"/>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- LAPTOP (back-left) — open clamshell with MT5 desktop -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <g transform="translate(50 130)" filter="url(#device-shadow)">
    <!-- Lid -->
    <rect x="0" y="0" width="640" height="380" rx="14" fill="#1c1f24"/>
    <rect x="14" y="14" width="612" height="352" rx="6" fill="url(#mt5-bg)"/>

    <!-- MT5 desktop window -->
    <g transform="translate(28 28)">
      <!-- Title bar -->
      <rect width="556" height="22" rx="3" fill="#22262d"/>
      <circle cx="14" cy="11" r="3" fill="#ff5f57"/>
      <circle cx="26" cy="11" r="3" fill="#febc2e"/>
      <circle cx="38" cy="11" r="3" fill="#28c840"/>
      <text x="280" y="15" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#cfd6dd">MetaTrader 5 — RakizFx</text>

      <!-- Toolbar -->
      <rect x="0" y="22" width="556" height="20" fill="#1a1e24"/>
      <g fill="#7f8a93" font-family="Inter, sans-serif" font-size="8">
        <text x="10" y="36">File</text>
        <text x="34" y="36">View</text>
        <text x="62" y="36">Insert</text>
        <text x="92" y="36">Charts</text>
        <text x="124" y="36">Tools</text>
        <text x="152" y="36">Window</text>
        <text x="190" y="36">Help</text>
      </g>
      <g transform="translate(440 27)" font-family="Inter, sans-serif" font-size="8" font-weight="600">
        <rect width="50" height="12" rx="2" fill="#1ad17a"/>
        <text x="25" y="9" text-anchor="middle" fill="#001b0e">New Order</text>
        <rect x="56" width="50" height="12" rx="2" fill="#ef4444"/>
        <text x="81" y="9" text-anchor="middle" fill="#fff">AutoTrade</text>
      </g>

      <!-- Layout: left panel + main chart + right panel -->
      <g transform="translate(0 46)">
        <!-- Symbols list -->
        <rect width="110" height="260" fill="#0c1116"/>
        <text x="6" y="11" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#cfd6dd">Market Watch</text>
        <g font-family="'JetBrains Mono', monospace" font-size="7" fill="#cfd6dd">
          <g transform="translate(0 20)">
            <text x="6" y="9">EUR/USD</text> <text x="60" y="9" fill="#1ad17a">1.0871</text> <text x="86" y="9" fill="#ef4444">1.0873</text>
          </g>
          <g transform="translate(0 32)">
            <text x="6" y="9">GBP/USD</text> <text x="60" y="9" fill="#1ad17a">1.2658</text> <text x="86" y="9" fill="#ef4444">1.2660</text>
          </g>
          <g transform="translate(0 44)">
            <text x="6" y="9">USD/JPY</text> <text x="60" y="9" fill="#ef4444">156.83</text> <text x="86" y="9" fill="#ef4444">156.85</text>
          </g>
          <g transform="translate(0 56)">
            <text x="6" y="9">XAU/USD</text> <text x="60" y="9" fill="#1ad17a">2348.5</text> <text x="86" y="9" fill="#ef4444">2349.0</text>
          </g>
          <g transform="translate(0 68)">
            <text x="6" y="9">BTC/USD</text> <text x="60" y="9" fill="#1ad17a">67432</text> <text x="86" y="9" fill="#ef4444">67450</text>
          </g>
          <g transform="translate(0 80)">
            <text x="6" y="9">ETH/USD</text> <text x="60" y="9" fill="#1ad17a">3142.8</text> <text x="86" y="9" fill="#ef4444">3143.5</text>
          </g>
          <g transform="translate(0 92)">
            <text x="6" y="9">USOIL</text> <text x="60" y="9" fill="#1ad17a">79.21</text> <text x="86" y="9" fill="#ef4444">79.24</text>
          </g>
          <g transform="translate(0 104)">
            <text x="6" y="9">NAS100</text> <text x="60" y="9" fill="#1ad17a">18472</text> <text x="86" y="9" fill="#ef4444">18475</text>
          </g>
          <g transform="translate(0 116)">
            <text x="6" y="9">US500</text>  <text x="60" y="9" fill="#1ad17a">5278</text> <text x="86" y="9" fill="#ef4444">5279</text>
          </g>
        </g>

        <!-- Main chart -->
        <use href="#mt5-chart" x="116" y="0" width="320" height="200"/>
        <!-- chart caption -->
        <text x="120" y="-2" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#cfd6dd">EUR/USD,H1</text>

        <!-- Indicator pane below chart -->
        <rect x="116" y="204" width="320" height="56" fill="#0a0e12"/>
        <g stroke="#1f2a30" stroke-width=".5"><line x1="116" y1="232" x2="436" y2="232"/></g>
        <polyline points="116,240 130,228 144,234 158,220 172,226 186,214 200,222 214,210 228,218 242,206 256,214 270,202 284,210 298,200 312,208 326,194 340,202 354,190 368,198 382,186 396,194 410,182 424,190 436,178" fill="none" stroke="#1ad17a" stroke-width="1.2"/>

        <!-- Order book right panel -->
        <rect x="442" y="0" width="114" height="260" fill="#0c1116"/>
        <text x="448" y="11" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#cfd6dd">Trade</text>
        <g font-family="'JetBrains Mono', monospace" font-size="7" fill="#cfd6dd">
          <text x="448" y="26">Volume 0.10</text>
          <rect x="448" y="34" width="104" height="20" fill="#1ad17a"/>
          <text x="500" y="48" text-anchor="middle" font-weight="700" fill="#001b0e">BUY 1.0871</text>
          <rect x="448" y="60" width="104" height="20" fill="#ef4444"/>
          <text x="500" y="74" text-anchor="middle" font-weight="700" fill="#fff">SELL 1.0869</text>
        </g>
        <g font-family="Inter, sans-serif" font-size="6" fill="#7f8a93">
          <text x="448" y="98">Spread 0.2 pips</text>
          <text x="448" y="110">Leverage 1:500</text>
          <text x="448" y="122">Swap (long) -1.2</text>
          <text x="448" y="134">Margin $217</text>
        </g>

        <!-- Open positions table -->
        <rect x="0" y="204" width="110" height="56" fill="#0c1116"/>
        <text x="6" y="216" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#cfd6dd">Open positions</text>
        <g font-family="'JetBrains Mono', monospace" font-size="6" fill="#cfd6dd">
          <text x="6" y="228">EURUSD +12.4</text>
          <text x="6" y="238">XAUUSD +84.5</text>
          <text x="6" y="248">BTCUSD -22.0</text>
        </g>
      </g>
    </g>

    <!-- Camera notch -->
    <circle cx="320" cy="8" r="2" fill="#0a0c10"/>
  </g>
  <!-- Laptop base (perspective) -->
  <g filter="url(#device-shadow)">
    <polygon points="20,512 720,512 700,540 40,540" fill="url(#mt5-body)"/>
    <rect x="270" y="514" width="200" height="6" rx="2" fill="#7f8a93"/>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- TABLET (right, slightly rotated) with MT5 chart -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <g transform="translate(760 180) rotate(6)" filter="url(#device-shadow)">
    <!-- Tablet body -->
    <rect x="0" y="0" width="380" height="490" rx="20" fill="url(#mt5-bezel)"/>
    <rect x="10" y="10" width="360" height="470" rx="12" fill="#06090c"/>

    <!-- Status bar -->
    <g transform="translate(22 22)" fill="#cfd6dd" font-family="Inter, sans-serif" font-size="9" font-weight="600">
      <text x="0" y="8">9:41</text>
      <text x="306" y="8" text-anchor="end">RakizFx · MT5</text>
    </g>

    <!-- Tabs -->
    <g transform="translate(22 40)" font-family="Inter, sans-serif" font-size="9" font-weight="600">
      <rect width="80" height="18" rx="9" fill="#1ad17a"/>
      <text x="40" y="12" text-anchor="middle" fill="#001b0e">Quotes</text>
      <text x="92" y="12" fill="#7f8a93">Chart</text>
      <text x="130" y="12" fill="#7f8a93">Trade</text>
      <text x="170" y="12" fill="#7f8a93">History</text>
      <text x="222" y="12" fill="#7f8a93">News</text>
    </g>

    <!-- Symbol header -->
    <g transform="translate(22 70)">
      <text x="0" y="11" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">XAU/USD</text>
      <text x="0" y="26" font-family="Inter, sans-serif" font-size="8" fill="#7f8a93">Gold · 1D · MT5</text>
      <g transform="translate(220 0)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#1ad17a">2,348.50</text>
        <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1ad17a">▲ +0.85%</text>
      </g>
    </g>

    <!-- Chart -->
    <use href="#mt5-chart" x="22" y="110" width="336" height="220"/>

    <!-- Timeframe row -->
    <g transform="translate(22 342)" font-family="Inter, sans-serif" font-size="8" font-weight="600">
      <text x="0" y="8" fill="#1ad17a">1M</text>
      <text x="24" y="8" fill="#7f8a93">5M</text>
      <text x="48" y="8" fill="#7f8a93">15M</text>
      <text x="76" y="8" fill="#7f8a93">1H</text>
      <text x="100" y="8" fill="#7f8a93">4H</text>
      <text x="124" y="8" fill="#7f8a93">1D</text>
      <text x="148" y="8" fill="#7f8a93">1W</text>
      <text x="172" y="8" fill="#7f8a93">MN</text>
    </g>

    <!-- BUY/SELL bar -->
    <g transform="translate(22 360)">
      <rect width="164" height="32" rx="16" fill="#1ad17a"/>
      <text x="82" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#001b0e">BUY 2348.50</text>
      <rect x="172" width="164" height="32" rx="16" fill="#ef4444"/>
      <text x="254" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">SELL 2348.20</text>
    </g>

    <!-- Position card -->
    <g transform="translate(22 408)">
      <rect width="336" height="50" rx="8" fill="#0e141a" stroke="#1f2a30"/>
      <text x="12" y="16" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#cfd6dd">XAU/USD · 0.10 lot · BUY</text>
      <text x="12" y="30" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7f8a93">Entry 2340.20 · SL 2330 · TP 2360</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1ad17a">P/L +$83.00</text>
    </g>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- PHONE (front center) with MT5 GOLD chart -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <g transform="translate(420 240)" filter="url(#device-shadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="260" height="500" rx="34" fill="url(#mt5-bezel)"/>
    <rect x="6" y="6" width="248" height="488" rx="28" fill="#06090c"/>
    <!-- Dynamic island -->
    <rect x="100" y="14" width="60" height="14" rx="7" fill="#0a0c10"/>

    <!-- Status bar -->
    <g transform="translate(20 40)" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="700">
      <text x="0" y="8">9:41</text>
      <text x="220" y="8" text-anchor="end">5G</text>
    </g>

    <!-- Header -->
    <g transform="translate(20 60)">
      <text x="0" y="11" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#cfd6dd">MetaTrader 5</text>
    </g>

    <!-- Symbol header -->
    <g transform="translate(20 84)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#fff">GOLD</text>
      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1ad17a">2348.50 ▲ +0.85%</text>
    </g>

    <!-- Mini chart -->
    <use href="#mt5-chart" x="14" y="130" width="232" height="200"/>

    <!-- Timeframes -->
    <g transform="translate(14 342)" font-family="Inter, sans-serif" font-size="8" font-weight="600">
      <text x="0" y="8" fill="#1ad17a">1M</text>
      <text x="22" y="8" fill="#7f8a93">15M</text>
      <text x="54" y="8" fill="#7f8a93">1H</text>
      <text x="80" y="8" fill="#7f8a93">4H</text>
      <text x="108" y="8" fill="#7f8a93">1D</text>
      <text x="134" y="8" fill="#7f8a93">1W</text>
      <text x="160" y="8" fill="#7f8a93">MN</text>
    </g>

    <!-- Quick stats -->
    <g transform="translate(14 360)">
      <rect width="232" height="48" rx="10" fill="#0e141a" stroke="#1f2a30"/>
      <g font-family="'JetBrains Mono', monospace" font-size="8" fill="#7f8a93">
        <text x="10" y="14">Spread</text>
        <text x="10" y="28" fill="#fff" font-weight="700">12 pips</text>
        <text x="86" y="14">Leverage</text>
        <text x="86" y="28" fill="#fff" font-weight="700">1:200</text>
        <text x="166" y="14">P/L</text>
        <text x="166" y="28" fill="#1ad17a" font-weight="700">+$84.5</text>
      </g>
    </g>

    <!-- BUY / SELL CTA pair -->
    <g transform="translate(14 416)">
      <rect width="110" height="36" rx="18" fill="#1ad17a"/>
      <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#001b0e">BUY 2348.50</text>
      <rect x="120" width="112" height="36" rx="18" fill="#ef4444"/>
      <text x="176" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#fff">SELL 2348.20</text>
    </g>

    <!-- Bottom nav -->
    <g transform="translate(20 462)" font-family="Inter, sans-serif" font-size="7" font-weight="600">
      <text x="0" y="8" fill="#1ad17a">Quotes</text>
      <text x="58" y="8" fill="#7f8a93">Chart</text>
      <text x="102" y="8" fill="#7f8a93">Trade</text>
      <text x="148" y="8" fill="#7f8a93">History</text>
      <text x="200" y="8" fill="#7f8a93">More</text>
    </g>

    <!-- Home indicator -->
    <rect x="92" y="486" width="80" height="3" rx="1.5" fill="#7f8a93" opacity=".6"/>
  </g>

