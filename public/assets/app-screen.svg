<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 880" width="460" height="880" role="img" aria-label="RakizFx mobile app on iPhone — balance, deposit, withdraw, profile">
  <defs>
    <!-- ────── DEVICE / FRAME GRADIENTS ────── -->
    <!-- Polished titanium outer band -->
    <linearGradient id="frameMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#1a1d22"/>
      <stop offset="0.05" stop-color="#4a5159"/>
      <stop offset="0.12" stop-color="#3a4046"/>
      <stop offset="0.5"  stop-color="#222529"/>
      <stop offset="0.88" stop-color="#3a4046"/>
      <stop offset="0.95" stop-color="#4a5159"/>
      <stop offset="1"    stop-color="#1a1d22"/>
    </linearGradient>
    <!-- Inner glass border (subtle) -->
    <linearGradient id="frameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1217"/>
      <stop offset="1" stop-color="#06090c"/>
    </linearGradient>
    <!-- Side button metal -->
    <linearGradient id="btnMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#262a2f"/>
      <stop offset="0.5"  stop-color="#4a5159"/>
      <stop offset="1"    stop-color="#262a2f"/>
    </linearGradient>
    <!-- Screen background gradient -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1217"/>
      <stop offset="1" stop-color="#070b0e"/>
    </linearGradient>
    <!-- Screen glare overlay (top-left diagonal) -->
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Balance card gradient (green) -->
    <linearGradient id="balance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1ad17a"/>
      <stop offset="0.6" stop-color="#0fb068"/>
      <stop offset="1"   stop-color="#066a3e"/>
    </linearGradient>
    <linearGradient id="balanceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Action gradients -->
    <linearGradient id="dep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="wit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="prf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="hist" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>

    <!-- Realistic device drop-shadow (kept very subtle so no grey shading around) -->
    <filter id="deviceShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Inner shadow for screen recess -->
    <filter id="screenInset" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ────── SIDE BUTTONS (drawn BEHIND the frame so they peek out) ────── -->
  <g filter="url(#deviceShadow)">
    <!-- Left side: silent switch -->
    <rect x="20" y="160" width="4" height="32" rx="2" fill="url(#btnMetal)"/>
    <!-- Left side: volume up -->
    <rect x="20" y="215" width="4" height="54" rx="2" fill="url(#btnMetal)"/>
    <!-- Left side: volume down -->
    <rect x="20" y="285" width="4" height="54" rx="2" fill="url(#btnMetal)"/>
    <!-- Right side: power -->
    <rect x="436" y="240" width="4" height="80" rx="2" fill="url(#btnMetal)"/>
  </g>

  <!-- ────── PHONE BODY ────── -->
  <g filter="url(#deviceShadow)">
    <!-- Outer titanium frame -->
    <rect x="24" y="20" width="412" height="840" rx="58" fill="url(#frameMetal)"/>
    <!-- Inner glass border (1.5 px) -->
    <rect x="28" y="24" width="404" height="832" rx="54" fill="url(#frameInner)"/>
    <!-- Subtle inner frame edge highlight -->
    <rect x="32" y="28" width="396" height="824" rx="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- ────── SCREEN ────── -->
    <rect x="36" y="32" width="388" height="816" rx="46" fill="url(#screen)"/>

    <!-- Screen glare (diagonal sheen across the top half) -->
    <rect x="36" y="32" width="388" height="816" rx="46" fill="url(#glare)" pointer-events="none"/>

    <!-- ────── DYNAMIC ISLAND ────── -->
    <g transform="translate(170 50)">
      <rect width="120" height="32" rx="16" fill="#000"/>
      <!-- Selfie camera lens -->
      <circle cx="92"  cy="16" r="6" fill="#0a0c10"/>
      <circle cx="92"  cy="16" r="4" fill="#16191e"/>
      <circle cx="92"  cy="16" r="2" fill="#080a0c"/>
      <circle cx="93"  cy="14" r="0.8" fill="#3b4046" opacity=".7"/>
      <!-- Face ID dot grid (subtle) -->
      <circle cx="20"  cy="16" r="2.4" fill="#1a1d22"/>
      <circle cx="20"  cy="16" r="1" fill="#3b4046" opacity=".6"/>
    </g>
  </g>

  <!-- ════════════════ APP CONTENT (kept entirely inside the screen) ════════════════ -->
  <!-- Status bar -->
  <g transform="translate(60 110)" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">
    <text x="0" y="8">9:41</text>
    <g transform="translate(298 -4)">
      <rect x="0" y="2" width="3" height="6" rx=".5" fill="#fff" opacity=".55"/>
      <rect x="5" y="2" width="3" height="6" rx=".5" fill="#fff" opacity=".7"/>
      <rect x="10" y="2" width="3" height="6" rx=".5" fill="#fff" opacity=".85"/>
      <rect x="15" y="2" width="3" height="6" rx=".5" fill="#fff"/>
      <text x="25" y="9" font-size="10" font-weight="600">5G</text>
      <rect x="46" y="0" width="20" height="10" rx="2" stroke="#fff" stroke-opacity=".7" fill="none"/>
      <rect x="48" y="2" width="14" height="6" rx="1" fill="#1ad17a"/>
    </g>
  </g>

  <!-- App header -->
  <g transform="translate(60 148)">
    <rect width="32" height="32" rx="9" fill="url(#balance)"/>
    <text x="16" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#fff">R</text>
    <text x="42" y="16" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">RakizFx</text>
    <text x="42" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#7f8a93">Welcome back, trader</text>

    <g transform="translate(304 4)">
      <circle r="14" fill="#1a1d22"/>
      <path d="M-4 -2 a4 4 0 1 1 8 0 c0 4 2 6 2 6 h-12 s2 -2 2 -6 z" stroke="#fff" stroke-width="1.4" fill="none"/>
      <path d="M-1.6 5 a 1.6 1.6 0 0 0 3.2 0" stroke="#fff" stroke-width="1.4" fill="none"/>
      <circle cx="6" cy="-8" r="3" fill="#ef4444"/>
    </g>
  </g>

  <!-- Balance card -->
  <g transform="translate(56 200)">
    <rect width="348" height="160" rx="22" fill="url(#balance)"/>
    <rect width="348" height="60" rx="22" fill="url(#balanceShine)"/>
    <circle cx="320" cy="20" r="60" fill="#ffffff" opacity=".08"/>
    <circle cx="350" cy="120" r="36" fill="#ffffff" opacity=".06"/>

    <text x="22" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#ffffff" opacity=".75">TOTAL BALANCE · USD</text>
    <text x="22" y="86" font-family="'Space Grotesk', Inter, sans-serif" font-size="36" font-weight="800" letter-spacing="-1.2" fill="#fff">$ 12,847.50</text>
    <g transform="translate(22 100)">
      <rect width="86" height="22" rx="11" fill="rgba(255,255,255,0.18)"/>
      <text x="43" y="15" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">▲ +$184.20</text>
      <text x="96" y="15" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity=".75">last 7 days</text>
    </g>

    <g transform="translate(22 138)" font-family="Inter, sans-serif" font-size="10">
      <text fill="#ffffff" opacity=".75">STP · #102943</text>
      <text x="220" fill="#ffffff" opacity=".75">Equity</text>
      <text x="260" font-weight="700" fill="#fff">$13,031.70</text>
    </g>
  </g>

  <!-- 4 quick actions (no card boxes — colorful icons only) -->
  <g transform="translate(60 384)" font-family="Inter, sans-serif">
    <g transform="translate(8 0)">
      <rect width="48" height="48" rx="14" fill="url(#dep)"/>
      <g transform="translate(24 24)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -10 v18"/><path d="M-6 2 l6 6 6 -6"/>
      </g>
      <text x="24" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Deposit</text>
    </g>
    <g transform="translate(98 0)">
      <rect width="48" height="48" rx="14" fill="url(#wit)"/>
      <g transform="translate(24 24)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 10 v-18"/><path d="M-6 -2 l6 -6 6 6"/>
      </g>
      <text x="24" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Withdraw</text>
    </g>
    <g transform="translate(188 0)">
      <rect width="48" height="48" rx="14" fill="url(#prf)"/>
      <g transform="translate(24 24)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle r="6" cy="-4"/><path d="M-10 14 a10 10 0 0 1 20 0"/>
      </g>
      <text x="24" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Profile</text>
    </g>
    <g transform="translate(278 0)">
      <rect width="48" height="48" rx="14" fill="url(#hist)"/>
      <g transform="translate(24 24)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle r="10"/><path d="M0 -6 v6 l5 4"/>
      </g>
      <text x="24" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">History</text>
    </g>
  </g>

  <!-- Recent transactions -->
  <g transform="translate(60 488)" font-family="Inter, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#fff">Recent activity</text>
    <text x="346" y="0" text-anchor="end" font-size="11" font-weight="600" fill="#1ad17a">See all</text>

    <g transform="translate(0 22)">
      <g transform="translate(0 10)">
        <rect width="34" height="34" rx="10" fill="url(#dep)"/>
        <g transform="translate(17 17)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 -7 v13"/><path d="M-4 2 l4 4 4 -4"/>
        </g>
      </g>
      <text x="48" y="20" font-size="12" font-weight="700" fill="#fff">Deposit · Bank wire</text>
      <text x="48" y="36" font-size="10" fill="#7f8a93">Today · 09:42</text>
      <text x="346" y="20" text-anchor="end" font-size="13" font-weight="700" fill="#1ad17a">+ $500.00</text>
      <text x="346" y="36" text-anchor="end" font-size="9" fill="#7f8a93">Completed</text>
      <line x1="0" y1="58" x2="346" y2="58" stroke="#1a2128" stroke-opacity=".55"/>
    </g>

    <g transform="translate(0 88)">
      <g transform="translate(0 10)">
        <rect width="34" height="34" rx="10" fill="url(#wit)"/>
        <g transform="translate(17 17)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 7 v-13"/><path d="M-4 -2 l4 -4 4 4"/>
        </g>
      </g>
      <text x="48" y="20" font-size="12" font-weight="700" fill="#fff">Withdraw · USDT</text>
      <text x="48" y="36" font-size="10" fill="#7f8a93">Yesterday · 14:08</text>
      <text x="346" y="20" text-anchor="end" font-size="13" font-weight="700" fill="#ef4444">− $200.00</text>
      <text x="346" y="36" text-anchor="end" font-size="9" fill="#7f8a93">Processed</text>
      <line x1="0" y1="58" x2="346" y2="58" stroke="#1a2128" stroke-opacity=".55"/>
    </g>

    <g transform="translate(0 154)">
      <g transform="translate(0 10)">
        <rect width="34" height="34" rx="10" fill="url(#hist)"/>
        <g transform="translate(17 17)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-7 4 l4 -4 4 3 6 -7"/>
        </g>
      </g>
      <text x="48" y="20" font-size="12" font-weight="700" fill="#fff">Closed · EUR/USD 0.10</text>
      <text x="48" y="36" font-size="10" fill="#7f8a93">2 days ago · MT5</text>
      <text x="346" y="20" text-anchor="end" font-size="13" font-weight="700" fill="#1ad17a">+ $84.20</text>
      <text x="346" y="36" text-anchor="end" font-size="9" fill="#7f8a93">Profit</text>
    </g>
  </g>

  <!-- Bottom nav (hairline only) -->
  <g transform="translate(60 760)" font-family="Inter, sans-serif" font-size="9" font-weight="600">
    <line x1="0" y1="0" x2="346" y2="0" stroke="#1a2128" stroke-opacity=".6"/>
    <g transform="translate(38 14)">
      <g stroke="#1ad17a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 6 l10 -10 l10 10"/>
        <path d="M2 4 v10 h16 v-10"/>
      </g>
      <text x="10" y="34" text-anchor="middle" fill="#1ad17a">Home</text>
    </g>
    <g transform="translate(110 14)">
      <g stroke="#7f8a93" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 14 l5 -5 l4 4 l8 -8"/><path d="M13 5 h4 v4"/>
      </g>
      <text x="10" y="34" text-anchor="middle" fill="#7f8a93">Markets</text>
    </g>
    <g transform="translate(168 6)">
      <circle cx="14" cy="14" r="22" fill="url(#balance)"/>
      <g transform="translate(14 14)" stroke="#001b0e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-6 0 h12"/><path d="M0 -6 v12"/>
      </g>
    </g>
    <g transform="translate(238 14)">
      <g stroke="#7f8a93" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="20" height="14" rx="2"/><path d="M0 6 h20"/><circle cx="15" cy="11" r="1.5" fill="#7f8a93"/>
      </g>
      <text x="10" y="34" text-anchor="middle" fill="#7f8a93">Wallet</text>
    </g>
    <g transform="translate(300 14)">
      <g stroke="#7f8a93" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="6" r="4"/><path d="M2 18 a8 8 0 0 1 16 0"/>
      </g>
      <text x="10" y="34" text-anchor="middle" fill="#7f8a93">Me</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="186" y="832" width="88" height="5" rx="2.5" fill="#7f8a93" opacity=".7"/>

  <!-- Subtle bottom highlight on screen bezel (glass curvature illusion) -->
  <rect x="36" y="828" width="388" height="20" rx="0" fill="url(#screen)" opacity="0.6"/>
</svg>
