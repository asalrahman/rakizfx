<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Commodities — cocoa, coffee, sugar, corn">
  <defs>
    <linearGradient id="comm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1612"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <radialGradient id="comm-glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#c69756" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1ad17a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#854a1d"/>
      <stop offset="1" stop-color="#3a1d0a"/>
    </linearGradient>
    <linearGradient id="cocoa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2208"/>
      <stop offset="1" stop-color="#22100a"/>
    </linearGradient>
    <linearGradient id="sugar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#bcc4cc"/>
    </linearGradient>
    <linearGradient id="corn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#a07000"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfa074"/>
      <stop offset="1" stop-color="#6b4f25"/>
    </linearGradient>
    <filter id="comm-blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="600" height="420" fill="url(#comm-bg)"/>
  <g opacity=".5" stroke="#1ad17a" stroke-opacity=".06" stroke-dasharray="3 6">
    <path d="M0 60H600M0 130H600M0 200H600M0 270H600M0 340H600"/>
  </g>
  <ellipse cx="300" cy="240" rx="260" ry="130" fill="url(#comm-glow)" filter="url(#comm-blur)"/>

  <!-- Header chip -->
  <g transform="translate(28 32)">
    <rect width="140" height="22" rx="11" fill="#c69756" fill-opacity=".18" stroke="#c69756" stroke-opacity=".55"/>
    <circle cx="14" cy="11" r="3" fill="#c69756"/>
    <text x="26" y="15" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#dcb37c">COMMODITIES · SPOT</text>
  </g>

  <!-- Cocoa sack (left) -->
  <g transform="translate(78 132)">
    <!-- Sack body -->
    <path d="M0 60 q-4 -50 60 -54 q70 -2 70 56 q0 80 -64 84 q-70 4 -66 -86z" fill="url(#sack)"/>
    <!-- Tied top -->
    <ellipse cx="60" cy="8" rx="38" ry="10" fill="#56401d"/>
    <!-- Cocoa beans spilling -->
    <g transform="translate(28 70)">
      <ellipse cx="0"  cy="0"  rx="9" ry="6" fill="url(#cocoa)" transform="rotate(-12)"/>
      <ellipse cx="22" cy="-4" rx="9" ry="6" fill="url(#cocoa)" transform="rotate(8 22 -4)"/>
      <ellipse cx="44" cy="0"  rx="9" ry="6" fill="url(#cocoa)" transform="rotate(-18 44 0)"/>
      <ellipse cx="66" cy="-2" rx="9" ry="6" fill="url(#cocoa)" transform="rotate(4 66 -2)"/>
      <ellipse cx="12" cy="14" rx="9" ry="6" fill="url(#cocoa)" transform="rotate(20 12 14)"/>
      <ellipse cx="36" cy="16" rx="9" ry="6" fill="url(#cocoa)" transform="rotate(-6 36 16)"/>
      <ellipse cx="58" cy="14" rx="9" ry="6" fill="url(#cocoa)" transform="rotate(14 58 14)"/>
      <!-- Bean creases -->
      <g fill="none" stroke="#1a0a04" stroke-width=".8" opacity=".6">
        <path d="M-7 0 q7 -2 14 0"/>
        <path d="M15 -4 q7 -2 14 0"/>
        <path d="M37 0 q7 -2 14 0"/>
        <path d="M59 -2 q7 -2 14 0"/>
      </g>
    </g>
    <!-- Label -->
    <g transform="translate(20 110)">
      <rect width="80" height="22" rx="6" fill="#0a1612" stroke="#c69756" stroke-opacity=".45"/>
      <text x="40" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#dcb37c">COCOA</text>
    </g>
  </g>

  <!-- Coffee beans pile -->
  <g transform="translate(248 158)">
    <ellipse cx="60" cy="56" rx="78" ry="22" fill="#11160f" opacity=".5"/>
    <!-- Beans -->
    <g>
      <ellipse cx="20" cy="40" rx="14" ry="9" fill="url(#bean)" transform="rotate(-10 20 40)"/>
      <ellipse cx="48" cy="32" rx="14" ry="9" fill="url(#bean)" transform="rotate(14 48 32)"/>
      <ellipse cx="76" cy="38" rx="14" ry="9" fill="url(#bean)" transform="rotate(-18 76 38)"/>
      <ellipse cx="104" cy="34" rx="14" ry="9" fill="url(#bean)" transform="rotate(6 104 34)"/>
      <ellipse cx="32" cy="56" rx="14" ry="9" fill="url(#bean)" transform="rotate(18 32 56)"/>
      <ellipse cx="62" cy="52" rx="14" ry="9" fill="url(#bean)" transform="rotate(-6 62 52)"/>
      <ellipse cx="92" cy="56" rx="14" ry="9" fill="url(#bean)" transform="rotate(20 92 56)"/>
      <!-- Center creases -->
      <g fill="none" stroke="#150905" stroke-width="1.2" opacity=".75">
        <path d="M9 40 q10 -3 22 0"/>
        <path d="M37 32 q10 -3 22 0"/>
        <path d="M65 38 q10 -3 22 0"/>
        <path d="M93 34 q10 -3 22 0"/>
        <path d="M21 56 q10 -3 22 0"/>
        <path d="M51 52 q10 -3 22 0"/>
        <path d="M81 56 q10 -3 22 0"/>
      </g>
    </g>
    <g transform="translate(34 80)">
      <rect width="92" height="22" rx="6" fill="#0a1612" stroke="#c69756" stroke-opacity=".45"/>
      <text x="46" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#dcb37c">COFFEE</text>
    </g>
  </g>

  <!-- Corn -->
  <g transform="translate(434 122)">
    <ellipse cx="40" cy="74" rx="40" ry="60" fill="url(#corn)" stroke="#5a3d00" stroke-width="1.5"/>
    <!-- Kernels -->
    <g fill="#ffe88a" opacity=".7">
      <circle cx="22" cy="40" r="3"/>
      <circle cx="32" cy="40" r="3"/>
      <circle cx="42" cy="40" r="3"/>
      <circle cx="52" cy="40" r="3"/>
      <circle cx="22" cy="54" r="3"/>
      <circle cx="32" cy="54" r="3"/>
      <circle cx="42" cy="54" r="3"/>
      <circle cx="52" cy="54" r="3"/>
      <circle cx="22" cy="68" r="3"/>
      <circle cx="32" cy="68" r="3"/>
      <circle cx="42" cy="68" r="3"/>
      <circle cx="52" cy="68" r="3"/>
      <circle cx="22" cy="82" r="3"/>
      <circle cx="32" cy="82" r="3"/>
      <circle cx="42" cy="82" r="3"/>
      <circle cx="52" cy="82" r="3"/>
      <circle cx="22" cy="96" r="3"/>
      <circle cx="32" cy="96" r="3"/>
      <circle cx="42" cy="96" r="3"/>
      <circle cx="52" cy="96" r="3"/>
      <circle cx="32" cy="110" r="3"/>
      <circle cx="42" cy="110" r="3"/>
    </g>
    <!-- Leaves -->
    <path d="M2 24 q-22 30 -10 78 q12 -36 30 -56" fill="#3a7d2c" opacity=".9"/>
    <path d="M78 24 q22 30 10 78 q-12 -36 -30 -56" fill="#3a7d2c" opacity=".9"/>
    <g transform="translate(0 142)">
      <rect width="80" height="22" rx="6" fill="#0a1612" stroke="#c69756" stroke-opacity=".45"/>
      <text x="40" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#dcb37c">CORN</text>
    </g>
  </g>

  <!-- Sugar cubes -->
  <g transform="translate(108 312)">
    <g transform="skewX(-22)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="url(#sugar)" stroke="#a7afba" stroke-width="1"/>
      <rect x="38" y="0" width="34" height="34" rx="4" fill="url(#sugar)" stroke="#a7afba" stroke-width="1"/>
      <rect x="19" y="-22" width="34" height="34" rx="4" fill="url(#sugar)" stroke="#a7afba" stroke-width="1"/>
    </g>
    <g transform="translate(0 50)">
      <rect width="78" height="22" rx="6" fill="#0a1612" stroke="#c69756" stroke-opacity=".45"/>
      <text x="39" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#dcb37c">SUGAR</text>
    </g>
  </g>

  <!-- Live price tag bottom-right -->
  <g transform="translate(440 326)">
    <rect width="138" height="60" rx="12" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
    <text x="14" y="22" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#1ad17a">COCOA</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#fff">9,852</text>
    <text x="110" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1ad17a">▲ 2.42%</text>
  </g>
</svg>
