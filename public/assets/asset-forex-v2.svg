<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Forex currency pairs">
  <defs>
    <linearGradient id="forex-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1612"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <radialGradient id="forex-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#1ad17a" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#1ad17a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#1ad17a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forex-globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15211b"/>
      <stop offset="1" stop-color="#0c1813"/>
    </linearGradient>
    <linearGradient id="forex-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1ad17a" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#1ad17a"/>
      <stop offset="1"   stop-color="#1ad17a" stop-opacity="0"/>
    </linearGradient>
    <filter id="forex-blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="600" height="420" fill="url(#forex-bg)"/>
  <g opacity=".55">
    <path d="M0 60H600M0 130H600M0 200H600M0 270H600M0 340H600" stroke="#1ad17a" stroke-opacity=".06" stroke-dasharray="3 6"/>
    <path d="M80 0V420M180 0V420M280 0V420M380 0V420M480 0V420" stroke="#1ad17a" stroke-opacity=".05" stroke-dasharray="3 6"/>
  </g>

  <circle cx="300" cy="210" r="220" fill="url(#forex-glow)" filter="url(#forex-blur)"/>

  <!-- Orbits -->
  <ellipse cx="300" cy="210" rx="220" ry="80" fill="none" stroke="url(#forex-ring)" stroke-width="1.2" opacity=".55"/>
  <ellipse cx="300" cy="210" rx="220" ry="80" fill="none" stroke="#1ad17a" stroke-width=".5" opacity=".25" transform="rotate(-18 300 210)"/>
  <ellipse cx="300" cy="210" rx="200" ry="110" fill="none" stroke="#1ad17a" stroke-width=".5" opacity=".18" transform="rotate(22 300 210)"/>

  <!-- Globe -->
  <g transform="translate(300 210)">
    <circle r="92" fill="url(#forex-globe)" stroke="#1ad17a" stroke-opacity=".4" stroke-width="1"/>
    <circle r="92" fill="none" stroke="#1ad17a" stroke-opacity=".18"/>
    <!-- Latitude lines -->
    <ellipse rx="92" ry="32" fill="none" stroke="#1ad17a" stroke-opacity=".25"/>
    <ellipse rx="92" ry="62" fill="none" stroke="#1ad17a" stroke-opacity=".18"/>
    <ellipse rx="92" ry="86" fill="none" stroke="#1ad17a" stroke-opacity=".12"/>
    <!-- Longitude -->
    <ellipse rx="22" ry="92" fill="none" stroke="#1ad17a" stroke-opacity=".22"/>
    <ellipse rx="55" ry="92" fill="none" stroke="#1ad17a" stroke-opacity=".18"/>
    <ellipse rx="86" ry="92" fill="none" stroke="#1ad17a" stroke-opacity=".12"/>
    <!-- Continents — simple shapes -->
    <path d="M-50 -22 q12 -16 28 -10 t26 4 l8 14 -12 6 -18 -2 -10 8 -16 -2 -8 -14z" fill="#1ad17a" opacity=".42"/>
    <path d="M-20 18 q14 -8 26 0 t18 10 -6 14 -22 6 -22 -10 4 -10z" fill="#1ad17a" opacity=".34"/>
    <path d="M28 -42 q10 -2 16 6 t-4 18 -14 -4z" fill="#1ad17a" opacity=".5"/>
    <!-- Pulse pin -->
    <circle cx="22" cy="-6" r="3.4" fill="#1ad17a"/>
    <circle cx="22" cy="-6" r="9" fill="none" stroke="#1ad17a" stroke-opacity=".55"/>
  </g>

  <!-- Currency-pair chips -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600">
    <g transform="translate(76 92)">
      <rect x="-6" y="-18" width="98" height="34" rx="10" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".55"/>
      <text x="44" y="3" text-anchor="middle" fill="#fff">EUR/USD</text>
      <text x="44" y="15" text-anchor="middle" fill="#1ad17a" font-size="9">1.0842 ▲</text>
    </g>
    <g transform="translate(420 60)">
      <rect x="-6" y="-18" width="100" height="34" rx="10" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".55"/>
      <text x="44" y="3" text-anchor="middle" fill="#fff">GBP/USD</text>
      <text x="44" y="15" text-anchor="middle" fill="#1ad17a" font-size="9">1.2658 ▲</text>
    </g>
    <g transform="translate(450 290)">
      <rect x="-6" y="-18" width="100" height="34" rx="10" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".55"/>
      <text x="44" y="3" text-anchor="middle" fill="#fff">USD/JPY</text>
      <text x="44" y="15" text-anchor="middle" fill="#ff8a92" font-size="9">156.83 ▼</text>
    </g>
    <g transform="translate(54 322)">
      <rect x="-6" y="-18" width="100" height="34" rx="10" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".55"/>
      <text x="44" y="3" text-anchor="middle" fill="#fff">AUD/USD</text>
      <text x="44" y="15" text-anchor="middle" fill="#1ad17a" font-size="9">0.6612 ▲</text>
    </g>
  </g>

  <!-- Header chip -->
  <g transform="translate(28 32)">
    <rect width="86" height="22" rx="11" fill="#1ad17a" fill-opacity=".14" stroke="#1ad17a" stroke-opacity=".4"/>
    <circle cx="14" cy="11" r="3" fill="#1ad17a"/>
    <text x="26" y="15" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#1ad17a">FOREX · LIVE</text>
  </g>

  <!-- Bottom volume sparkline -->
  <g transform="translate(0 360)" opacity=".75">
    <polyline points="40,30 80,18 120,22 160,10 200,16 240,4 280,12 320,2 360,8 400,14 440,6 480,18 520,10 560,22" fill="none" stroke="#1ad17a" stroke-width="1.5"/>
    <polyline points="40,30 80,18 120,22 160,10 200,16 240,4 280,12 320,2 360,8 400,14 440,6 480,18 520,10 560,22 560,52 40,52" fill="#1ad17a" fill-opacity=".06"/>
  </g>
</svg>
