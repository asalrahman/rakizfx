<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Global shares — Apple, Microsoft, NVIDIA, Tesla, Meta, Alphabet">
  <defs>
    <linearGradient id="shares-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1612"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <radialGradient id="shares-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1ad17a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1ad17a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shares-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ad17a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1ad17a" stop-opacity="0"/>
    </linearGradient>
    <filter id="shares-blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="600" height="420" fill="url(#shares-bg)"/>

  <!-- Grid -->
  <g opacity=".5" stroke="#1ad17a" stroke-opacity=".06" stroke-dasharray="3 6">
    <path d="M0 80H600M0 140H600M0 200H600M0 260H600M0 320H600"/>
    <path d="M70 30V370M140 30V370M210 30V370M280 30V370M350 30V370M420 30V370M490 30V370M560 30V370"/>
  </g>

  <ellipse cx="300" cy="240" rx="260" ry="140" fill="url(#shares-glow)" filter="url(#shares-blur)"/>

  <!-- Header chip -->
  <g transform="translate(28 32)">
    <rect width="120" height="22" rx="11" fill="#1ad17a" fill-opacity=".14" stroke="#1ad17a" stroke-opacity=".5"/>
    <circle cx="14" cy="11" r="3" fill="#1ad17a"/>
    <text x="26" y="15" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#1ad17a">STOCKS · NYSE/NASDAQ</text>
  </g>

  <!-- Ticker tape top -->
  <g transform="translate(30 76)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
    <rect x="0" y="-14" width="540" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".25"/>
    <g fill="#fff">
      <text x="16"  y="4">AAPL</text>  <text x="60"  y="4" fill="#1ad17a">184.32 ▲</text>
      <text x="148" y="4">MSFT</text>  <text x="192" y="4" fill="#1ad17a">422.15 ▲</text>
      <text x="280" y="4">NVDA</text>  <text x="324" y="4" fill="#1ad17a">894.30 ▲</text>
      <text x="420" y="4">TSLA</text>  <text x="464" y="4" fill="#ff8a92">178.42 ▼</text>
    </g>
  </g>

  <!-- Candlestick chart -->
  <g transform="translate(50 138)">
    <!-- Area under -->
    <polygon points="0,180 0,150 30,150 30,140 60,140 60,120 90,120 90,108 120,108 120,90 150,90 150,76 180,76 180,60 210,60 210,52 240,52 240,40 270,40 270,30 300,30 300,18 330,18 330,8 360,8 380,18 480,18 480,180" fill="url(#shares-up)"/>
    <!-- Up line -->
    <polyline points="0,150 30,140 60,120 90,108 120,90 150,76 180,60 210,52 240,40 270,30 300,18 330,8 360,8 380,18 480,18" fill="none" stroke="#1ad17a" stroke-width="2"/>
    <!-- Candles -->
    <g>
      <!-- Body / wick generators -->
      <line x1="20" y1="155" x2="20" y2="170" stroke="#1ad17a" stroke-width=".8"/><rect x="14" y="155" width="12" height="14" fill="#1ad17a"/>
      <line x1="56" y1="145" x2="56" y2="172" stroke="#1ad17a" stroke-width=".8"/><rect x="50" y="145" width="12" height="20" fill="#1ad17a"/>
      <line x1="92" y1="120" x2="92" y2="160" stroke="#1ad17a" stroke-width=".8"/><rect x="86" y="120" width="12" height="32" fill="#1ad17a"/>
      <line x1="128" y1="106" x2="128" y2="142" stroke="#1ad17a" stroke-width=".8"/><rect x="122" y="106" width="12" height="28" fill="#1ad17a"/>
      <line x1="164" y1="92" x2="164" y2="118" stroke="#1ad17a" stroke-width=".8"/><rect x="158" y="92" width="12" height="20" fill="#1ad17a"/>
      <line x1="200" y1="84" x2="200" y2="98" stroke="#ff8a92" stroke-width=".8"/><rect x="194" y="84" width="12" height="12" fill="#ff8a92"/>
      <line x1="236" y1="56" x2="236" y2="92" stroke="#1ad17a" stroke-width=".8"/><rect x="230" y="56" width="12" height="28" fill="#1ad17a"/>
      <line x1="272" y1="36" x2="272" y2="60" stroke="#1ad17a" stroke-width=".8"/><rect x="266" y="36" width="12" height="20" fill="#1ad17a"/>
      <line x1="308" y1="20" x2="308" y2="48" stroke="#1ad17a" stroke-width=".8"/><rect x="302" y="20" width="12" height="22" fill="#1ad17a"/>
      <line x1="344" y1="12" x2="344" y2="30" stroke="#1ad17a" stroke-width=".8"/><rect x="338" y="12" width="12" height="14" fill="#1ad17a"/>
      <line x1="380" y1="14" x2="380" y2="36" stroke="#ff8a92" stroke-width=".8"/><rect x="374" y="14" width="12" height="18" fill="#ff8a92"/>
      <line x1="416" y1="8"  x2="416" y2="26" stroke="#1ad17a" stroke-width=".8"/><rect x="410" y="8"  width="12" height="14" fill="#1ad17a"/>
      <line x1="452" y1="6"  x2="452" y2="22" stroke="#1ad17a" stroke-width=".8"/><rect x="446" y="6"  width="12" height="12" fill="#1ad17a"/>
    </g>

    <!-- Last marker -->
    <circle cx="488" cy="14" r="4.5" fill="#1ad17a"/>
    <circle cx="488" cy="14" r="9.5" fill="none" stroke="#1ad17a" stroke-opacity=".55"/>

    <!-- Big trend arrow label -->
    <g transform="translate(360 -10)">
      <rect x="0" y="0" width="148" height="22" rx="11" fill="#1ad17a"/>
      <text x="74" y="15" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#001b0e">NVDA · +2.85%</text>
    </g>
  </g>

  <!-- Symbol badges -->
  <g transform="translate(30 348)" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">
    <g transform="translate(0 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">AAPL</text>
    </g>
    <g transform="translate(74 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">MSFT</text>
    </g>
    <g transform="translate(148 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">NVDA</text>
    </g>
    <g transform="translate(222 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">TSLA</text>
    </g>
    <g transform="translate(296 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">META</text>
    </g>
    <g transform="translate(370 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">GOOG</text>
    </g>
    <g transform="translate(444 0)">
      <rect width="62" height="28" rx="6" fill="#0a1612" stroke="#1ad17a" stroke-opacity=".4"/>
      <text x="31" y="18" text-anchor="middle" fill="#fff">AMZN</text>
    </g>
  </g>
</svg>
