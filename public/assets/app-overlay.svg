<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 672" width="360" height="672" role="img" aria-label="RakizFx app screen content">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1217"/>
      <stop offset="1" stop-color="#070b0e"/>
    </linearGradient>
    <linearGradient id="balance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1ad17a"/>
      <stop offset="0.6" stop-color="#0fb068"/>
      <stop offset="1"   stop-color="#066a3e"/>
    </linearGradient>
    <linearGradient id="balanceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="wit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="prf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="hist" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  </defs>

  <!-- Screen background -->
  <rect width="360" height="672" fill="url(#screen)"/>

  <!-- Status bar -->
  <g transform="translate(18 14)" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">
    <text x="0" y="8">9:41</text>
    <g transform="translate(265 -3)">
      <rect x="0" y="2" width="2.6" height="5" rx=".5" fill="#fff" opacity=".55"/>
      <rect x="4" y="2" width="2.6" height="5" rx=".5" fill="#fff" opacity=".7"/>
      <rect x="8" y="2" width="2.6" height="5" rx=".5" fill="#fff" opacity=".85"/>
      <rect x="12" y="2" width="2.6" height="5" rx=".5" fill="#fff"/>
      <text x="21" y="8" font-size="9" font-weight="600">5G</text>
      <rect x="39" y="0" width="18" height="9" rx="2" stroke="#fff" stroke-opacity=".7" fill="none"/>
      <rect x="41" y="2" width="12" height="5" rx="1" fill="#1ad17a"/>
    </g>
  </g>

  <!-- App header -->
  <g transform="translate(18 44)">
    <rect width="28" height="28" rx="8" fill="url(#balance)"/>
    <text x="14" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#fff">R</text>
    <text x="38" y="14" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">RakizFx</text>
    <text x="38" y="26" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#7f8a93">Welcome back, trader</text>

    <g transform="translate(290 4)">
      <circle r="13" fill="#1a1d22"/>
      <path d="M-4 -2 a4 4 0 1 1 8 0 c0 4 2 6 2 6 h-12 s2 -2 2 -6 z" stroke="#fff" stroke-width="1.3" fill="none"/>
      <path d="M-1.6 5 a 1.6 1.6 0 0 0 3.2 0" stroke="#fff" stroke-width="1.3" fill="none"/>
      <circle cx="6" cy="-8" r="3" fill="#ef4444"/>
    </g>
  </g>

  <!-- Balance card -->
  <g transform="translate(18 90)">
    <rect width="324" height="148" rx="20" fill="url(#balance)"/>
    <rect width="324" height="56" rx="20" fill="url(#balanceShine)"/>
    <circle cx="298" cy="18" r="56" fill="#ffffff" opacity=".08"/>
    <circle cx="326" cy="112" r="34" fill="#ffffff" opacity=".06"/>

    <text x="20" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#ffffff" opacity=".75">TOTAL BALANCE · USD</text>
    <text x="20" y="78" font-family="'Space Grotesk', Inter, sans-serif" font-size="32" font-weight="800" letter-spacing="-1" fill="#fff">$ 12,847.50</text>
    <g transform="translate(20 92)">
      <rect width="80" height="20" rx="10" fill="rgba(255,255,255,0.18)"/>
      <text x="40" y="14" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#fff">▲ +$184.20</text>
      <text x="86" y="14" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" opacity=".75">last 7 days</text>
    </g>

    <g transform="translate(20 128)" font-family="Inter, sans-serif" font-size="9">
      <text fill="#ffffff" opacity=".75">STP · #102943</text>
      <text x="204" fill="#ffffff" opacity=".75">Equity</text>
      <text x="240" font-weight="700" fill="#fff">$13,031.70</text>
    </g>
  </g>

  <!-- 4 quick actions (no card backgrounds — just gradient icons + label) -->
  <g transform="translate(18 254)" font-family="Inter, sans-serif">
    <g transform="translate(0 0)">
      <rect width="44" height="44" rx="12" fill="url(#dep)"/>
      <g transform="translate(22 22)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -9 v16"/><path d="M-5 1 l5 5 5 -5"/>
      </g>
      <text x="22" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Deposit</text>
    </g>
    <g transform="translate(82 0)">
      <rect width="44" height="44" rx="12" fill="url(#wit)"/>
      <g transform="translate(22 22)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 9 v-16"/><path d="M-5 -1 l5 -5 5 5"/>
      </g>
      <text x="22" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Withdraw</text>
    </g>
    <g transform="translate(164 0)">
      <rect width="44" height="44" rx="12" fill="url(#prf)"/>
      <g transform="translate(22 22)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle r="5" cy="-3"/><path d="M-9 13 a9 9 0 0 1 18 0"/>
      </g>
      <text x="22" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Profile</text>
    </g>
    <g transform="translate(246 0)">
      <rect width="44" height="44" rx="12" fill="url(#hist)"/>
      <g transform="translate(22 22)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle r="9"/><path d="M0 -5 v5 l4 3"/>
      </g>
      <text x="22" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">History</text>
    </g>
  </g>

  <!-- Recent activity -->
  <g transform="translate(18 360)" font-family="Inter, sans-serif">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#fff">Recent activity</text>
    <text x="322" y="0" text-anchor="end" font-size="10" font-weight="600" fill="#1ad17a">See all</text>

    <g transform="translate(0 20)">
      <g transform="translate(0 8)">
        <rect width="30" height="30" rx="9" fill="url(#dep)"/>
        <g transform="translate(15 15)" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 -6 v12"/><path d="M-3 2 l3 3 3 -3"/>
        </g>
      </g>
      <text x="42" y="18" font-size="11" font-weight="700" fill="#fff">Deposit · Bank wire</text>
      <text x="42" y="32" font-size="9" fill="#7f8a93">Today · 09:42</text>
      <text x="322" y="18" text-anchor="end" font-size="12" font-weight="700" fill="#1ad17a">+ $500.00</text>
      <text x="322" y="32" text-anchor="end" font-size="8" fill="#7f8a93">Completed</text>
      <line x1="0" y1="52" x2="322" y2="52" stroke="#1a2128" stroke-opacity=".55"/>
    </g>

    <g transform="translate(0 80)">
      <g transform="translate(0 8)">
        <rect width="30" height="30" rx="9" fill="url(#wit)"/>
        <g transform="translate(15 15)" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 6 v-12"/><path d="M-3 -2 l3 -3 3 3"/>
        </g>
      </g>
      <text x="42" y="18" font-size="11" font-weight="700" fill="#fff">Withdraw · USDT</text>
      <text x="42" y="32" font-size="9" fill="#7f8a93">Yesterday · 14:08</text>
      <text x="322" y="18" text-anchor="end" font-size="12" font-weight="700" fill="#ef4444">− $200.00</text>
      <text x="322" y="32" text-anchor="end" font-size="8" fill="#7f8a93">Processed</text>
      <line x1="0" y1="52" x2="322" y2="52" stroke="#1a2128" stroke-opacity=".55"/>
    </g>

    <g transform="translate(0 140)">
      <g transform="translate(0 8)">
        <rect width="30" height="30" rx="9" fill="url(#hist)"/>
        <g transform="translate(15 15)" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-6 4 l4 -4 3 3 5 -6"/>
        </g>
      </g>
      <text x="42" y="18" font-size="11" font-weight="700" fill="#fff">Closed · EUR/USD 0.10</text>
      <text x="42" y="32" font-size="9" fill="#7f8a93">2 days ago · MT5</text>
      <text x="322" y="18" text-anchor="end" font-size="12" font-weight="700" fill="#1ad17a">+ $84.20</text>
      <text x="322" y="32" text-anchor="end" font-size="8" fill="#7f8a93">Profit</text>
    </g>
  </g>

  <!-- Bottom nav -->
  <g transform="translate(18 580)" font-family="Inter, sans-serif" font-size="8" font-weight="600">
    <line x1="0" y1="0" x2="322" y2="0" stroke="#1a2128" stroke-opacity=".6"/>
    <g transform="translate(30 12)">
      <g stroke="#1ad17a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 6 l10 -10 l10 10"/>
        <path d="M2 4 v10 h16 v-10"/>
      </g>
      <text x="10" y="30" text-anchor="middle" fill="#1ad17a">Home</text>
    </g>
    <g transform="translate(100 12)">
      <g stroke="#7f8a93" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 14 l5 -5 l4 4 l8 -8"/><path d="M13 5 h4 v4"/>
      </g>
      <text x="10" y="30" text-anchor="middle" fill="#7f8a93">Markets</text>
    </g>
    <g transform="translate(154 4)">
      <circle cx="14" cy="14" r="20" fill="url(#balance)"/>
      <g transform="translate(14 14)" stroke="#001b0e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-6 0 h12"/><path d="M0 -6 v12"/>
      </g>
    </g>
    <g transform="translate(220 12)">
      <g stroke="#7f8a93" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="20" height="14" rx="2"/><path d="M0 6 h20"/><circle cx="15" cy="11" r="1.4" fill="#7f8a93"/>
      </g>
      <text x="10" y="30" text-anchor="middle" fill="#7f8a93">Wallet</text>
    </g>
    <g transform="translate(280 12)">
      <g stroke="#7f8a93" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="6" r="4"/><path d="M2 18 a8 8 0 0 1 16 0"/>
      </g>
      <text x="10" y="30" text-anchor="middle" fill="#7f8a93">Me</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="140" y="652" width="80" height="4" rx="2" fill="#7f8a93" opacity=".7"/>
</svg>
